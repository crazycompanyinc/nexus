[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent-hub"
version = "0.1.0"
description = "Universal agent integration hub with plugin discovery, permissions, workflows, and metrics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nexus" }]
dependencies = [
  "click>=8.1",
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
nexus = "nexus.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["nexus*"]
